name: CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mec
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mec_empire_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mec -d mec_empire_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mec:ci-only-password@localhost:5432/mec_empire_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report result
        if: always()
        run: echo "Validation result - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
